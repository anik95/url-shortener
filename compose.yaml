services:
  db:
    image: postgres:18
    container_name: url-shortener-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - '${POSTGRES_PORT}:5432'
    volumes:
      - pgdata:/var/lib/postgresql

  redis:
    image: redis:8
    container_name: url-shortener-redis
    ports:
      - '${REDIS_PORT}:6379'

volumes:
  pgdata:
